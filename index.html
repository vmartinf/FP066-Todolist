<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Proyectos - Producto 1</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="bg-primary text-white text-center py-3"> <!-- estilos de Bootstrap -->
        <h1>Gestión de Proyectos</h1>
    </header>
    <main class="container my-5"><!-- estilos de Bootstrap -->
        <div id="app">
            <!-- Aquí se cargará el contenido dinámico. Es un fragmento de html que está recogido en el archivo main.js. -->
        </div>
    </main>
    <footer class="bg-light text-center py-3"><!-- estilos de Bootstrap -->
        <p>&copy; 2025 FP066 - Proyecto To-Do List</p>
    </footer>
    <!-- Modal para crear un nuevo proyecto -->
    <div class="modal fade" id="projectModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nuevo Proyecto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="projectForm">
                        <div class="mb-3">
                            <label for="projectName" class="form-label">Nombre del Proyecto</label>
                            <input type="text" class="form-control" id="projectName" required>
                        </div>
                        <div class="mb-3">
                            <label for="projectDescription" class="form-label">Descripción</label>
                            <textarea class="form-control" id="projectDescription" rows="3" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="saveProjectBtn">Guardar</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <!--============== -->
    <!-- archivo javaSrcipt de Bootstrap para modales y menús desplegables -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Vínculo al archivo javaSrcipt personalizado -->
    <script src="js/main.js"></script>
</body>
</html>
